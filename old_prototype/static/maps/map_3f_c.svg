<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .wall { fill: none; stroke: #334155; stroke-width: 4; }
      .room-label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #64748b; }
      .shelf { fill: #cbd5e1; stroke: #94a3b8; stroke-width: 2; rx: 4; }
      .shelf-text { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: middle; }
      .highlight { fill: #ef4444; stroke: #b91c1c; stroke-width: 3; rx: 4; filter: drop-shadow(0 0 8px rgba(239,68,68,0.7)); }
      .highlight-text { font-family: sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .corridor { fill: #f1f5f9; stroke: #e2e8f0; stroke-dasharray: 4; }
      .legend { font-family: sans-serif; font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="600" height="400" class="bg" />
  <rect x="20" y="20" width="560" height="360" rx="8" class="wall" />
  <line x1="260" y1="380" x2="340" y2="380" stroke="#ffffff" stroke-width="6" />
  <text x="300" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="bold">階段・エレベーター口 (3F)</text>
  
  <rect x="35" y="35" width="120" height="32" rx="6" fill="#1e293b" />
  <text x="95" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">研究棟 3F</text>
  
  <rect x="230" y="70" width="140" height="290" class="corridor" />
  <text x="300" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#94a3b8">実験室前廊下</text>

  <text x="120" y="75" text-anchor="middle" class="room-label">制御実験室 棚</text>
  
  <rect x="50" y="100" width="140" height="70" class="shelf" />
  <text x="120" y="135" class="shelf-text">棚 A (PLC・計測器)</text>

  <rect x="50" y="190" width="140" height="70" class="shelf" />
  <text x="120" y="225" class="shelf-text">棚 B (電源・インバータ)</text>

  <!-- Shelf C: TARGET HIGHLIGHTED -->
  <rect x="50" y="280" width="140" height="70" class="highlight" />
  <text x="120" y="315" class="highlight-text">★ 棚 C (電磁開閉器)</text>
  <circle cx="190" cy="280" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <text x="190" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">ここ！</text>

  <text x="470" y="75" text-anchor="middle" class="room-label">保管保管庫</text>
  
  <rect x="400" y="100" width="150" height="110" class="shelf" />
  <text x="475" y="155" class="shelf-text">薬品・特殊部品庫</text>

  <rect x="400" y="240" width="150" height="110" class="shelf" />
  <text x="475" y="295" class="shelf-text">試作品保管棚</text>

  <rect x="35" y="355" width="230" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0" />
  <text x="45" y="369" class="legend">保管場所: <tspan font-weight="bold" fill="#ef4444">3F-C</tspan></text>
</svg>
