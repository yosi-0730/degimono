services:
  web:
    build: .
    container_name: degimono-web
    ports:
      - "5000:5000"
    environment:
      TZ: Asia/Tokyo
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      # SEED_DEMO: "0"   # 本番運用でデモ部品データを投入したくない場合
    volumes:
      - ./data:/app/data      # SQLite DB をホスト側に永続化
    depends_on:
      - mosquitto
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: degimono-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
